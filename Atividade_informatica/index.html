
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <title>Laboratório</title>
    <link rel="stylesheet" href="Style.css">
    

</head>

    <div id="container">

            </div>

        </header>

        <main>

            <div id="outrotitulo">
                <h2>Monitoramento de Computadores</h2>
            </div>

            <div id="grupo1" class="grupo">

                <div class="box ligado">pc1</div>

                <div class="box ligado">pc12</div>

            </div>

            <div id="grupo4" class="grupo">

                <div class="box ligado">pc13</div>

                <div class="box ligado">pc15</div>
                <div class="box ligado">pc16</div>

            <div class="clear"></div>

            <div id="gitbox">

            <div class="box desligado"></div>

            </div>
            <div class="clear"></div>

           


        </main>
         

    </div>

</html>
